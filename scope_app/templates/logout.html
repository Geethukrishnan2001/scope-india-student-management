{% extends 'base.html' %}

{% block content %}

<!-- Hero Section -->
<div class="hero">
    <h1 class="display-5 fw-bold">
        Logout Successful
    </h1>

    <p class="lead">
        Thank you for visiting SCOPE INDIA
    </p>
</div>

<!-- Logout Card -->
<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card p-5 text-center shadow-sm">

                <!-- Success Icon -->
                <div class="mb-4">
                    <h1 style="font-size: 70px;"></h1>
                </div>

                <!-- Message -->
                <h2 class="text-success fw-bold mb-3">
                    You Have Logged Out Successfully
                </h2>

                <p class="text-muted">
                    Your session has ended safely.
                    We hope to see you again soon.
                </p>

                <!-- Buttons -->
                <div class="mt-4">

                    <a href="/login" class="btn btn-primary btn-custom me-2">
                        Login Again
                    </a>

                    <a href="/" class="btn btn-outline-dark btn-custom">
                        Back to Home
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
