{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SCOPE INDIA</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <style>

        /* GLOBAL STYLES */

        body {
            background-color: #f8f9fa;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* HERO SECTION */

        .hero {
            background: linear-gradient(to right, #0a1e3c, #4a6fa6);
            color: white;
            padding: 100px 20px;
            text-align: center;
        }


        /* NAVBAR */

        .navbar {
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
        }

        .nav-link {
            transition: 0.3s;
            border-radius: 5px;
            padding: 8px 15px !important;
        }

        .nav-link:hover {
            background: white;
            color: #0d6efd !important;
            transform: translateY(-2px);
        }


        /* CARDS */

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            transition: 0.4s;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
        }


        /* FORM */

        .form-control {
            border-radius: 10px;
            transition: 0.3s;
        }

        .form-control:focus {
            box-shadow: 0px 0px 10px rgba(13, 110, 253, 0.5);
            border-color: #0d6efd;
        }


        /* BUTTONS */

        .btn-custom {
            border-radius: 10px;
            padding: 10px 20px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
        }


        /* IMAGES */

        img {
            transition: 0.4s;
        }

        img:hover {
            transform: scale(1.03);
        }


        /* FOOTER */

        .footer {
            background: #212529;
            color: white;
            padding: 20px;
            text-align: center;
            margin-top: 50px;
        }


        /* COURSE BOX */

        .course-box {
            padding: 30px;
            background: white;
            border-radius: 15px;
            transition: 0.4s;
        }

        .course-box:hover {
            background: #0c66ee;
            color: white;
            transform: translateY(-10px);
        }

    </style>

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <!-- Logo -->
            <img src="{% static 'images/scopeindia.png' %}"
                alt="Logo"
                height="60"
                class="me-2">

            <span class="ms-2 fw-bold text-white fs-4">
                SCOPE INDIA
            </span>

            <!-- Mobile Toggle -->
            <button 
                class="navbar-toggler" 
                type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navbarNav"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Links -->
            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/contact">Contact</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/register">Register</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/login">Login</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/logout">Logout</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Page Content -->

    {% block content %}
    {% endblock %}

    <!-- Footer -->

    <div class="footer">
        <p class="mb-0">
            © 2026 SCOPE INDIA | All Rights Reserved
        </p>
    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
